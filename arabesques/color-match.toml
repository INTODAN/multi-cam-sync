[[validated_multicams]]
media_pool_folder = "Master/multicams"
name = "Take 2,6,7 Multicam"
face_track = 3
hands_track = 2
wide_track = 1
face_active_version = "Camera match 2026-10-09"
hands_active_version = "Manual refine v2 2026-10-09"
previous_hands_version = "Camera match 2026-10-09"

[review]
date = 2026-10-09
multicam_count = 4
cameras = ["face", "hands", "wide"]
source_sample_count = 36
full_timeline_shot_count = 46
method = "Three positions per camera in every multicam, plus one midpoint frame per edited shot"
finding = "The initial overall-consistency assessment was too broad; residual Take 9 wide differences prompted a second refinement on 2026-10-10"
limitation = "Sampled still-image review; small local lighting and pose differences remain"
local_evidence = "reports/all-camera-review-20261009/"
latest_wide_refinement = 2026-10-10
latest_wide_evidence = "reports/take9-wide-v2-20261010/"
