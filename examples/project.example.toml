# Sanitized partial-video example. Copy this file and replace the selectors/paths.
schema_version = 1

[project]
timeline_name = "Arabesques — Take 8 partial sync"
cuts_file = "Arabesques_composite_cuts.txt"

[master]
media_pool_folder = "Audio/Masters"
media_pool_name = "Arabesques final master.wav"
audio_path = "media/arabesques-final-master.wav"

# Only Take 8 A and Take 8 B are video-enabled. Every other take in the cut
# list remains audio-only, with an intentional empty interval on Video Track 1.
[[sources]]
id = "take-8-a"
take = "Take 8 A"
media_pool_folder = "Video/Multicam"
media_pool_name = "Take 8 multicam"
audio_reference_path = "media/take-8-reference.mov"
source_start = "00:00:00.000"
source_end = "00:02:10.000"

[[sources]]
id = "take-8-b"
take = "Take 8 B"
media_pool_folder = "Video/Multicam"
media_pool_name = "Take 8 multicam"
audio_reference_path = "media/take-8-reference.mov"
source_start = "00:02:25.000"
source_end = "00:05:20.000"
